name: CI

on:
  push:
    branches: [main]
  pull_request:
    # "edited" re-runs the checks when the PR title/body changes — the
    # breaking-change gate reads the title, so a late edit must re-evaluate.
    types: [opened, edited, synchronize, reopened]

# Nothing here writes to the repository — every job checks out, builds and
# reports. Granting read at workflow level is both the least privilege that
# works and the explicit declaration code scanning asks for; release.yml, which
# does need write, declares it per job instead.
permissions:
  contents: read

jobs:
  breaking-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the breaking-change marker when the vector contract changes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_vector_breaking_change.py "origin/$BASE_REF"

  markdown-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Check markdown formatting
        run: deno fmt --check

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned tooling
        run: "pip install --only-binary :all: -r requirements-ci.txt"
      - name: Validate vector file shape
        run: python scripts/validate_vectors.py
      - name: Run vectors against the reference implementation
        run: python -m pytest reference/tests -q
      - name: Type-check (basedpyright)
        run: basedpyright

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned tooling
        run: "pip install --only-binary :all: -r requirements-ci.txt"
      - name: Run the native-core and binding vectors + differentials (system cc)
        run: python -m pytest core/tests bindings/python/tests -q
      - name: Compile and run the exhaustive driver under ASan/UBSan
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            core/tests/exhaustive_driver.c core/gavel.c -o gavel_driver
          ./gavel_driver

      - name: Compile and run the decision-table driver under ASan/UBSan
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            core/tests/decision_table_driver.c core/gavel.c -o gavel_table_driver
          ./gavel_table_driver
      - name: Guard the core stays freestanding (zero dependencies)
        # Same guard the release pipeline enforces on the shipped artifact —
        # here so a PR that reintroduces a libc import fails before merge.
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -fno-builtin -fPIC -shared -O2 core/gavel.c -o libgavel-guard.so
          if readelf -d libgavel-guard.so | grep NEEDED; then
            echo "ERROR: library gained a shared-library dependency"
            exit 1
          fi
          # Only GLOBAL undefined symbols (nm type "U") are real dependencies —
          # gcc's crt stubs add harmless WEAK ones to every .so.
          if nm -D --undefined-only libgavel-guard.so | grep ' U '; then
            echo "ERROR: library has global undefined symbols"
            exit 1
          fi

  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # SONAR_TOKEN does not reach Dependabot or forked-PR runs, so the scan can
    # only fail there. Skipped rather than failed; `sonar-gate` below is what
    # branch protection requires.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar needs full history to attribute new code to the right commits.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Produce C coverage
        # gavel.c is compiled once and both drivers link that same object, so
        # the two sweeps accumulate into one .gcda — a merged report rather
        # than two partial ones. Only the core is reported; the drivers are
        # tests and Sonar does not ask them for coverage.
        run: |
          mkdir -p build/cov build/gcov
          cc --coverage -std=c99 -O0 -g -c core/gavel.c -o build/cov/gavel.o
          cc --coverage -std=c99 -O0 -g -c core/tests/exhaustive_driver.c -o build/cov/exhaustive.o
          cc --coverage -std=c99 -O0 -g -c core/tests/decision_table_driver.c -o build/cov/table.o
          cc --coverage build/cov/gavel.o build/cov/exhaustive.o -o build/cov/exhaustive
          cc --coverage build/cov/gavel.o build/cov/table.o -o build/cov/table
          ./build/cov/exhaustive
          ./build/cov/table
          gcov -o build/cov core/gavel.c
          mv gavel.c.gcov build/gcov/

      - name: Produce Python coverage
        # Run here rather than shipping an artifact between jobs: the whole
        # suite is ~1.5s, so a second run costs less than the plumbing would.
        run: |
          pip install --only-binary :all: -r requirements-ci.txt
          python -m pytest reference/tests core/tests bindings/python/tests \
            --cov --cov-report=xml -q

      - name: SonarQube Cloud scan
        # C is analysed in AutoConfig mode — the CI default, no build wrapper
        # and no compilation database. The scanner waits on the quality gate
        # (sonar.qualitygate.wait) and exits non-zero when it fails, so this
        # job's own result is the verdict.
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Branch-protection shim: `sonarcloud` is skipped on Dependabot and forked
  # PRs, and a skipped required check never reports success — which would
  # deadlock exactly those PRs. This job always reports: it passes when the scan
  # succeeded or was skipped, and fails only when the scan failed. Make THIS the
  # required status check, not `sonarcloud`.
  sonar-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [sonarcloud]
    if: always()
    steps:
      - name: Require the scan to pass (skipped on Dependabot / forked PRs)
        env:
          SONAR_RESULT: ${{ needs.sonarcloud.result }}
        run: |
          echo "sonarcloud job result: $SONAR_RESULT"
          if [ "$SONAR_RESULT" = "failure" ] || [ "$SONAR_RESULT" = "cancelled" ]; then
            echo "::error::SonarQube Cloud did not pass"
            exit 1
          fi
