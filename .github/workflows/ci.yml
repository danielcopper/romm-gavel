name: CI

on:
  push:
    branches: [main]
  pull_request:
    # "edited" re-runs the checks when the PR title/body changes — the
    # breaking-change gate reads the title, so a late edit must re-evaluate.
    types: [opened, edited, synchronize, reopened]

jobs:
  breaking-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the breaking-change marker when the vector contract changes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_vector_breaking_change.py "origin/$BASE_REF"

  markdown-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check markdown formatting
        run: deno fmt --check

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate vector file shape
        run: python scripts/validate_vectors.py
      - name: Run vectors against the reference implementation
        run: |
          pip install pytest
          python -m pytest reference/tests -q
      - name: Type-check (basedpyright)
        run: |
          pip install basedpyright
          basedpyright

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the native-core and binding vectors + differentials (system cc)
        run: |
          pip install pytest
          python -m pytest core/tests bindings/python/tests -q
      - name: Compile and run the exhaustive driver under ASan/UBSan
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            core/tests/exhaustive_driver.c core/gavel.c -o gavel_driver
          ./gavel_driver

      - name: Compile and run the decision-table driver under ASan/UBSan
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            core/tests/decision_table_driver.c core/gavel.c -o gavel_table_driver
          ./gavel_table_driver
      - name: Guard the core stays freestanding (zero dependencies)
        # Same guard the release pipeline enforces on the shipped artifact —
        # here so a PR that reintroduces a libc import fails before merge.
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -fno-builtin -fPIC -shared -O2 core/gavel.c -o libgavel-guard.so
          if readelf -d libgavel-guard.so | grep NEEDED; then
            echo "ERROR: library gained a shared-library dependency"
            exit 1
          fi
          # Only GLOBAL undefined symbols (nm type "U") are real dependencies —
          # gcc's crt stubs add harmless WEAK ones to every .so.
          if nm -D --undefined-only libgavel-guard.so | grep ' U '; then
            echo "ERROR: library has global undefined symbols"
            exit 1
          fi
