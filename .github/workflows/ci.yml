name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check markdown formatting
        run: deno fmt --check

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate vector file shape
        run: python scripts/validate_vectors.py
      - name: Run vectors against the reference implementation
        run: |
          pip install pytest
          python -m pytest reference/tests -q
