[tools]
zig = "0.14.1"   # local C compiler (`zig cc`, clang-based) — SteamOS ships no system cc; CI uses ubuntu's cc
python = "3.12"  # runs the vector harnesses (pytest)
uv = "0.10.2"    # creates the venv and installs pytest

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install the pinned test dependencies into the local venv"
run = "uv pip install --only-binary :all: -r requirements-ci.txt"

[tasks.lock-update]
description = "Recompile requirements-ci.txt from requirements-ci.in (run after editing the sources)"
run = "uv pip compile requirements-ci.in -o requirements-ci.txt"

[tasks.build]
description = "Build the core as a shared library (build/libgavel.so)"
run = [
    "mkdir -p build",
    "zig cc -std=c99 -Wall -Wextra -Werror -pedantic -fno-builtin -fPIC -shared -O2 core/gavel.c -o build/libgavel.so",
]

[tasks.test]
description = "Run every conformance vector against the reference, the C core, and the Python binding"
run = "env CC='zig cc' python -m pytest reference/tests core/tests bindings/python/tests -q"

[tasks.sanitize]
description = "Run the C drivers under ASan+UBSan"
run = [
    "mkdir -p build",
    "zig cc -std=c99 -Wall -Wextra -Werror -pedantic -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all core/tests/exhaustive_driver.c core/gavel.c -o build/gavel_driver",
    "./build/gavel_driver",
    "zig cc -std=c99 -Wall -Wextra -Werror -pedantic -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all core/tests/decision_table_driver.c core/gavel.c -o build/gavel_table_driver",
    "./build/gavel_table_driver",
]

[tasks.validate]
description = "Check every vector file's shape"
run = "python scripts/validate_vectors.py"
