sonar.projectKey=danielcopper_romm-gavel
sonar.organization=danielcopper

# What gets analysed. The vectors are the normative artifact, not code, and the
# reference exists so the vectors have a first consumer — both are still worth
# analysing, but the JSON is data and Sonar has nothing useful to say about it.
sonar.sources=core,reference/gavel_reference,bindings/python/gavel_native,scripts
sonar.tests=core/tests,reference/tests,bindings/python/tests

# core/tests sits inside core, so it would land in both sets and the scanner
# refuses to index a file twice. sonar.exclusions applies to the main set only,
# which leaves sonar.tests above intact. The other two families need no such
# rule — their tests are siblings of the sources, not nested in them.
sonar.exclusions=core/tests/**

# C is analysed in AutoConfig mode, which is the default for CI-based analysis:
# no compilation database and no build wrapper, which suits a core that builds
# with a single cc invocation.

# Python coverage only. The C core is exercised by every vector plus two
# sanitizer drivers walking 1296 and 16296 input combinations, so a coverage
# percentage there would restate what those already prove exhaustively — not
# worth a second, instrumented build to produce.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12

# scripts/ are CI gates, not library code: CI runs validate_vectors.py in the
# `vectors` job and check_vector_breaking_change.py in `breaking-gate` on every
# PR, so they are exercised — just not by pytest. Demanding pytest coverage of
# them would measure the wrong thing. They stay in sonar.sources, so quality and
# security rules still apply.
sonar.coverage.exclusions=scripts/**

# Quality Gate
# Make the scanner poll the gate and exit non-zero when it fails, so the
# `sonarcloud` CI job itself carries the verdict instead of the SonarCloud app's
# asynchronous commit status. Branch protection then requires a job that always
# reports (see the `sonar-gate` shim in ci.yml), rather than a status that never
# posts on Dependabot PRs.
sonar.qualitygate.wait=true
